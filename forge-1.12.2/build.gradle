buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197'
    }
}

apply plugin: 'net.minecraftforge.gradle'
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = mod_version
group = mod_group_id
archivesBaseName = "${mod_id}G-${minecraft_version}-forge"
def artifactVersion = mod_version.toString().replaceFirst(/-forge1122$/, '')

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

minecraft {
    // The mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   Snapshot are built nightly.
    // stable_#            Stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: 'snapshot', version: '20171003-1.12'
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.

    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }

        server {

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }
    }
}

repositories {
    maven {
        url = 'https://cursemaven.com'
    }
}

configurations {
    forge1122UniversalRunFix {
        transitive = false
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    forge1122UniversalRunFix "net.minecraftforge:forge:${minecraft_version}-${forge_version}:universal"
    compileOnly fg.deobf('curse.maven:applied-energistics-2-223794:2747063')
    testCompile 'org.ow2.asm:asm-debug-all:5.2'

    // You may put jars on which you depend on in ./libs or you may define them like so..
    // compile "some.group:artifact:version:classifier"
    // compile "some.group:artifact:version"

    // Real examples
    // compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'  // adds buildcraft to the dev env
    // compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

    // The 'provided' configuration is for optional dependencies that exist at compile-time but might not at runtime.
    // provided 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // These dependencies get remapped to your current MCP mappings
    // deobf 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // For more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

}

task startupRegression(type: JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    main = 'com.extrarawstyle.veinminerplus.startup.StartupRegression'
    systemProperty 'java.awt.headless', 'true'
    jvmArgs '-Xverify:all'
    doFirst {
        def cachedForge = new File(gradle.gradleUserHomeDir,
                "caches/forge_gradle/maven_downloader/net/minecraftforge/forge/${minecraft_version}-${forge_version}/forge-${minecraft_version}-${forge_version}-universal.jar")
        args((cachedForge.isFile() ? cachedForge : configurations.forge1122UniversalRunFix.singleFile).absolutePath,
                new File(gradle.gradleUserHomeDir,
                        'caches/forge_gradle/minecraft_repo/versions/1.12.2/client.jar').absolutePath)
    }
}

check.dependsOn startupRegression

task compatibilityRegression(type: JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    main = 'com.extrarawstyle.veinminerplus.CompatibilityRegression'
    workingDir = file("$buildDir/compatibility-regression")
    systemProperty 'java.awt.headless', 'true'
    jvmArgs '-Xverify:all'
    doFirst {
        workingDir.mkdirs()
        def compatibilityJars = project.findProperty('aeCompatibilityJars')
        if (compatibilityJars) {
            args compatibilityJars.toString().split(java.util.regex.Pattern.quote(File.pathSeparator))
        } else {
            ['appliedenergistics2-rv6-stable-7.jar', 'ae2-uel-v0.56.7.jar'].each { name ->
                def downloaded = file("../.gradle/ae2-compat/downloads/${name}")
                if (downloaded.isFile()) {
                    args downloaded.absolutePath
                }
            }
        }
    }
}

check.dependsOn compatibilityRegression

task extractForge1122SideForRun(type: Sync) {
    from { zipTree(configurations.forge1122UniversalRunFix.singleFile) }
    include 'net/minecraftforge/fml/relauncher/Side.class'
    into "$buildDir/run-side-fix"
}

def configureForge1122ServerRun = { serverRun ->
    serverRun.dependsOn extractForge1122SideForRun
    serverRun.doFirst {
        def incompatibleAsm = ['asm-6.2.jar', 'asm-analysis-6.2.jar',
                'asm-tree-6.2.jar', 'asm-util-6.2.jar'] as Set
        def filteredClasspath = serverRun.classpath.filter { !incompatibleAsm.contains(it.name) }
        serverRun.classpath = files("$buildDir/run-side-fix") + filteredClasspath
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == 'runServer') {
        configureForge1122ServerRun(task)
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', minecraft_version
    filesMatching(['mcmod.info']) {
        expand 'version': project.version, 'mcversion': minecraft_version, 'mod_description': mod_description
    }
}

jar {
    version = artifactVersion
    manifest {
        attributes([
            "Specification-Title": mod_id,
            "Specification-Vendor": mod_authors,
            "Specification-Version": "1", // We are version 1 of ourselves
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" : mod_authors,
            "FMLCorePlugin": "com.extrarawstyle.veinminerplus.startup.StartupLoadingPlugin",
            "FMLCorePluginContainsFMLMod": "true"
        ])
    }
}

// Example configuration to allow publishing using the maven-publish task
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar')
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
//publish.dependsOn('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
